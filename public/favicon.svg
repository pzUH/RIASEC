<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="needle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#090D16"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="url(#bg)" stroke-width="1.5"/>
  <!-- Compass circle -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Compass needle -->
  <polygon points="16,8 19,16 16,14 13,16" fill="url(#needle)"/>
  <polygon points="16,24 19,16 16,18 13,16" fill="#f43f5e"/>
  <!-- Center hub -->
  <circle cx="16" cy="16" r="2" fill="#ffffff"/>
</svg>
